global:
  gitOps:
    repoURL: https://github.com/FHSAF/cs-cg.git
  image:
    pullSecret: harbor-pull-secret-project-ds
    repositoryBase: harbor.tecomon.net/project/
    tag: 0.1.0-main.0
  service:
    enabled: false
  ingress:
    enabled: false
  serviceAccount:
    create: false
  replicaCount: 0
  argocdImageUpdater:
    enabled: false
    gitCredsSecretName: git-creds
    branch: main
    updateStrategy: newest-build
    allowTags: ""
applications:
  mp-api:
    enabled: true
    namespace: dev
  woist-page:
    enabled: true
    namespace: dev
  app1:
    enabled: false
    namespace: devho
  app2:
    enabled: false
    namespace: devho
  app3-intances:
    enabled: true
    intances:
      - name: instance1
        namespace: devo
      - name: instance2
        namespace: devo
      - name: instance3
        namespace: devor
      - name: instance4
        namespace: devor
